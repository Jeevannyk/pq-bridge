name: pqbank

# PQBank: 8 bank services + 1 external partner + 2 customer apps + the operator toolbox.
# Signing keys live in runtime/kms and are mounted into the kms container only (and the toolbox, which issues them).

x-node: &node
  build: .
  image: pqbridge-node:latest
  networks: [bank]
  restart: unless-stopped

x-svc-vols: &svcvols
  - ./runtime/pki:/pki:ro
  - ./runtime/state:/state:ro
  - ./runtime/conf:/conf:ro

services:
  toolbox:
    <<: *node
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./runtime/pki:/pki
      - ./runtime/state:/state
      - ./runtime/evidence:/evidence
      - ./runtime/kms:/kms
      - ./runtime/clearing-trust:/clearing-trust

  postgres:
    <<: *node
    command: ["postgres"]
    volumes:
      - ./runtime/pki:/pki:ro
      - ./runtime/state:/state:ro
      - ./runtime/conf:/conf:ro
      - pg-data:/data

  kms:
    <<: *node
    command: ["kms"]
    volumes:
      - ./runtime/pki:/pki:ro
      - ./runtime/state:/state:ro
      - ./runtime/conf:/conf:ro
      - ./runtime/kms:/kms:ro

  clearing:
    <<: *node
    command: ["clearing"]
    volumes:
      - ./runtime/pki:/pki:ro
      - ./runtime/state:/state:ro
      - ./runtime/conf:/conf:ro
      - ./runtime/clearing-trust:/clearing-trust:ro
      - clearing-data:/data

  identity:
    <<: *node
    command: ["identity"]
    volumes: *svcvols
    depends_on: [postgres, kms]

  ledger:
    <<: *node
    command: ["ledger"]
    volumes: *svcvols
    depends_on: [postgres, kms]

  accounts:
    <<: *node
    command: ["accounts"]
    volumes: *svcvols
    depends_on: [postgres, identity]

  payments:
    <<: *node
    command: ["payments"]
    volumes: *svcvols
    depends_on: [postgres, identity, ledger]

  settlement:
    <<: *node
    command: ["settlement"]
    volumes: *svcvols
    depends_on: [postgres, kms, clearing]

  gateway:
    <<: *node
    command: ["gateway"]
    ports: ["8443:443"]
    volumes: *svcvols
    depends_on: [identity, accounts, payments]

  loadgen:
    <<: *node
    command: ["loadgen"]
    volumes:
      - ./runtime/pki:/pki:ro
      - ./runtime/state:/state
    depends_on: [gateway]

  legacy:
    <<: *node
    command: ["legacy"]
    volumes:
      - ./runtime/pki:/pki:ro
      - ./runtime/state:/state
    depends_on: [gateway]

networks:
  bank: {}

volumes:
  pg-data: {}
  clearing-data: {}
