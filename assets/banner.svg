<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">PQ-Bridge</title>
  <desc id="d">Animated banner: classical cryptography packets cross a verification gate and arrive as post-quantum.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1b4d"/>
      <stop offset="1" stop-color="#163a96"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5b700" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f5b700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
    .title{font-size:80px;font-weight:800;letter-spacing:7px;fill:#f6f2eb}
    .sub{font-size:25px;fill:#cfd8ff}
    .tag{font-size:15px;font-weight:700;letter-spacing:5px;fill:#f5b700}
    .end{font-size:19px;font-weight:700;letter-spacing:1px}
    .old{fill:#ff8f80}.new{fill:#6ee7a0}
    .chip rect{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.25;stroke-width:1.5}
    .chip text{font-size:17px;font-weight:700;letter-spacing:3px;fill:#cfd8ff;text-anchor:middle}
    .spin1{transform-origin:140px 118px;animation:spin 14s linear infinite}
    .spin2{transform-origin:140px 118px;animation:spin 9s linear infinite reverse}
    .core{transform-origin:140px 118px;animation:pulse 2.4s ease-in-out infinite}
    .halo{animation:halo 2.4s ease-in-out infinite}
    .pkt{animation:cross 4.5s linear infinite backwards}
    .gate{transform-origin:600px 244px;animation:gate 4.5s ease-in-out infinite}
    .chip{animation:lit 7.5s ease-in-out infinite backwards}
    .chip rect{animation:litbox 7.5s ease-in-out infinite backwards;animation-delay:inherit}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    @keyframes halo{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes cross{
      0%{transform:translateX(0);fill:#ff8f80;opacity:0}
      8%{opacity:1}
      44%{fill:#ff8f80}
      52%{fill:#6ee7a0}
      92%{opacity:1}
      100%{transform:translateX(540px);fill:#6ee7a0;opacity:0}
    }
    @keyframes gate{0%,40%,60%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
    @keyframes lit{0%,16%,100%{opacity:.75}6%{opacity:1}}
    @keyframes litbox{0%,16%,100%{fill:#ffffff;fill-opacity:.07;stroke-opacity:.25}6%{fill:#f5b700;fill-opacity:.9;stroke-opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect y="336" width="1200" height="4" fill="#f5b700"/>

  <!-- emblem: two counter-rotating rings around a pulsing core -->
  <circle class="halo" cx="140" cy="118" r="78" fill="url(#glow)"/>
  <g class="spin1">
    <circle cx="140" cy="118" r="62" fill="none" stroke="#f6f2eb" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 9"/>
    <circle cx="202" cy="118" r="6" fill="#f6f2eb"/>
  </g>
  <g class="spin2">
    <circle cx="140" cy="118" r="44" fill="none" stroke="#f5b700" stroke-width="2.5" stroke-dasharray="40 14"/>
    <circle cx="140" cy="74" r="5" fill="#f5b700"/>
  </g>
  <circle class="core" cx="140" cy="118" r="17" fill="#f5b700"/>

  <text class="title" x="262" y="130">PQ-BRIDGE</text>
  <text class="sub" x="266" y="168">Verification-gated post-quantum migration for banking</text>
  <text class="tag" x="266" y="198">FIND  ·  PRIORITISE  ·  MIGRATE  ·  PROVE</text>

  <!-- the bridge: classical in, post-quantum out, every change passes the gate -->
  <text class="end old" x="60" y="250">RSA · ECDSA · X25519</text>
  <text class="end new" x="1140" y="250" text-anchor="end">HQC · FN-DSA · SLH-DSA</text>
  <line x1="330" y1="244" x2="870" y2="244" stroke="#ffffff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 8"/>
  <circle class="pkt" cx="330" cy="244" r="7" style="animation-delay:0s"/>
  <circle class="pkt" cx="330" cy="244" r="7" style="animation-delay:1.5s"/>
  <circle class="pkt" cx="330" cy="244" r="7" style="animation-delay:3s"/>
  <g class="gate">
    <rect x="582" y="224" width="36" height="40" rx="5" fill="#0a1b4d" stroke="#f5b700" stroke-width="3"/>
    <path d="M590 245l7 7 14-15" fill="none" stroke="#f5b700" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the pipeline lights up one step at a time -->
  <g transform="translate(185 285)">
    <g class="chip" style="animation-delay:0s"><rect width="150" height="34" rx="17"/><text x="75" y="23">FIND</text></g>
    <g class="chip" transform="translate(170 0)" style="animation-delay:1.5s"><rect width="150" height="34" rx="17"/><text x="75" y="23">SCORE</text></g>
    <g class="chip" transform="translate(340 0)" style="animation-delay:3s"><rect width="150" height="34" rx="17"/><text x="75" y="23">SCHEDULE</text></g>
    <g class="chip" transform="translate(510 0)" style="animation-delay:4.5s"><rect width="150" height="34" rx="17"/><text x="75" y="23">MIGRATE</text></g>
    <g class="chip" transform="translate(680 0)" style="animation-delay:6s"><rect width="150" height="34" rx="17"/><text x="75" y="23">PROVE</text></g>
  </g>
</svg>
